<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Original schematic map, not a Google Maps tile. Road layout approximates
       real public Austin-area highway geography (I-35, MoPac/Loop 1, US-183,
       US-290, Lady Bird Lake) for visual orientation only, not surveyed data. -->
  <defs>
    <pattern id="austinGrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#E4E1D6" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="400" height="400" fill="#F1EFE6"/>
  <rect x="0" y="0" width="400" height="400" fill="url(#austinGrid)"/>

  <!-- greenspace -->
  <path d="M40 60 Q90 40 130 80 Q120 130 70 130 Q30 110 40 60Z" fill="#D9E8D3"/>
  <path d="M60 250 Q110 230 140 270 Q120 310 70 300 Q40 280 60 250Z" fill="#D9E8D3"/>
  <path d="M280 90 Q330 80 350 120 Q330 150 290 140 Q270 110 280 90Z" fill="#D9E8D3"/>

  <!-- Lady Bird Lake / Colorado River -->
  <path d="M0 232 C60 224, 120 244, 180 230 C240 216, 300 238, 400 226"
        fill="none" stroke="#AFD4E8" stroke-width="10" stroke-linecap="round"/>

  <!-- Loop 1 / MoPac -->
  <path d="M150 10 C150 110, 150 300, 150 395" fill="none" stroke="#F5C451" stroke-width="5"/>
  <!-- I-35 -->
  <path d="M232 5 C230 110, 230 300, 234 395" fill="none" stroke="#F0965A" stroke-width="7"/>
  <!-- US-183 -->
  <path d="M20 40 C130 110, 260 190, 380 300" fill="none" stroke="#F5C451" stroke-width="5"/>
  <!-- US-290 -->
  <path d="M0 300 C120 292, 260 300, 400 280" fill="none" stroke="#F5C451" stroke-width="5"/>
  <!-- 360 -->
  <path d="M90 90 C120 160, 150 210, 195 245" fill="none" stroke="#F5C451" stroke-width="4"/>

  <!-- route shields -->
  <circle cx="150" cy="70" r="10" fill="#F7C948" stroke="#B48A17" stroke-width="1.5"/>
  <text x="150" y="74" font-family="Space Grotesk, sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#5A4300">1</text>
  <circle cx="232" cy="120" r="11" fill="#E8743B" stroke="#9C4A1E" stroke-width="1.5"/>
  <text x="232" y="124" font-family="Space Grotesk, sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#FFFFFF">35</text>
  <circle cx="330" cy="260" r="10" fill="#F7C948" stroke="#B48A17" stroke-width="1.5"/>
  <text x="330" y="264" font-family="Space Grotesk, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle" fill="#5A4300">183</text>
  <circle cx="90" cy="292" r="10" fill="#F7C948" stroke="#B48A17" stroke-width="1.5"/>
  <text x="90" y="296" font-family="Space Grotesk, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle" fill="#5A4300">290</text>

  <!-- suburb labels for orientation, approximate real relative positions -->
  <text x="205" y="26" font-family="Space Grotesk, sans-serif" font-size="10" fill="#8A8880">Round Rock</text>
  <text x="60" y="46" font-family="Space Grotesk, sans-serif" font-size="10" fill="#8A8880">Cedar Park</text>
  <text x="320" y="60" font-family="Space Grotesk, sans-serif" font-size="10" fill="#8A8880">Pflugerville</text>
  <text x="30" y="200" font-family="Space Grotesk, sans-serif" font-size="10" fill="#8A8880">Lakeway</text>
  <text x="330" y="340" font-family="Space Grotesk, sans-serif" font-size="10" fill="#8A8880">Del Valle</text>

  <!-- downtown core label, offset well clear of the dot-ring radius (see
       CITY_MAP_ANCHOR + ringR in fleet-dashboard.ts) so markers never cover it -->
  <text x="234" y="285" font-family="Space Grotesk, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#292826">Austin</text>
</svg>
